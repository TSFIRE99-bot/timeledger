# Build the documentation website and measure test coverage.
# The site is pushed to the gh-pages branch; GitHub Pages serves it once the
# repository is public and Pages is enabled for that branch.
on:
  push:
    branches: [master, main]
  workflow_dispatch:
name: pkgdown-coverage
permissions:
  contents: write
jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: timeledger
          extra-packages: any::pkgdown, any::covr, local::.
          needs: website
      - name: Build site
        run: Rscript -e 'pkgdown::build_site_github_pages("timeledger", new_process = FALSE, install = FALSE)'
      - name: Test coverage
        run: |
          Rscript -e 'cv <- covr::package_coverage("timeledger", type = "tests"); print(cv); cat(sprintf("TOTAL COVERAGE: %.1f%%\n", covr::percent_coverage(cv))); writeLines(capture.output(print(cv, group = "functions")), "coverage.txt")'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.txt
      - name: Deploy site to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4.6.4
        with:
          clean: true
          branch: gh-pages
          folder: timeledger/docs
