# Temporary: build the PDF manual and print the LaTeX log on the
# configurations where the manual check failed.
on: workflow_dispatch
name: debug-manual
jobs:
  manual:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: release}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - name: Build manual
        shell: bash
        run: |
          R CMD Rd2pdf --no-preview --batch --no-clean -o manual.pdf timeledger || true
          ls -la .Rd2pdf* 2>/dev/null || true
          for f in .Rd2pdf*/Rd2.log; do echo "=== $f"; grep -n -B2 -A8 "^!" "$f" | head -80; done
          tlmgr --version || true
